server.port=8080

# Comma-separated origins for the React dev server / production URL
app.cors.allowed-origins=http://localhost:3000

# Razorpay — set via environment or this file (never commit real secrets)
# export RAZORPAY_KEY_ID=rzp_test_xxx
# export RAZORPAY_KEY_SECRET=xxx
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# --- Active JPA and Database settings ---
spring.datasource.url=jdbc:h2:mem:ratantataidb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Load DB Structure locally from schema.sql
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=true
